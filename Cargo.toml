[package]
name = "scale_dependent_point_selection"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Add scale-dependent selection values to GeoPackage point layers."
readme = "README.md"
repository = "https://github.com/HelloJowet/scale_dependent_point_selection"
license = "Apache-2.0"
keywords = ["geospatial", "rtree", "nearest-neighbor", "point-selection"]
categories = ["algorithms", "science::geo"]

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
geo = "0.31.0"
geo-types = "0.7.20"
rstar = "0.13.0"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
same-file = "1.0.6"
tempfile = "3.21.0"

[[bin]]
name = "scale-dependent-point-selection"
path = "src/main.rs"
